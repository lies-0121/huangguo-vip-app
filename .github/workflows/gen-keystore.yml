name: Generate signing keystore (run once)

# 只跑一次：生成固定的签名文件，然后把它提交进仓库。
# 不跑也能编出 APK，只是用 debug 签名，以后升级要卸载重装。

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair -v             -keystore android/app/huangguo.jks             -storetype JKS             -keyalg RSA -keysize 2048 -validity 10950             -alias huangguo             -storepass huangguo2026 -keypass huangguo2026             -dname "CN=Huangguo, OU=Self, O=Self, L=CN, ST=CN, C=CN"
          cat > android/key.properties <<'EOF'
          storePassword=huangguo2026
          keyPassword=huangguo2026
          keyAlias=huangguo
          storeFile=huangguo.jks
          EOF
          echo "----- 指纹（同一把 key 签名一致） -----"
          keytool -list -v -keystore android/app/huangguo.jks -storepass huangguo2026 | grep -E "SHA1|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: |
            android/app/huangguo.jks
            android/key.properties
          retention-days: 30
