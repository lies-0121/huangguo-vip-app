name: huangguo_vip
description: "黄果短剧客户端（JSON API + WebView 取源）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  # 与 Flutter 3.24.5 配套的版本，故意写死不加 ^，
  # 避免 pub 解析到要求 compileSdk 35 的新版 Android 实现包。
  http: 1.2.0
  shared_preferences: 2.2.2
  video_player: 2.8.2
  webview_flutter: 4.9.0
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
